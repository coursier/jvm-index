name: Publish
on:
  push:
    branches:
    - master
    tags:
    - 'v*'
  pull_request:

defaults:
  run:
    working-directory: publish

jobs:
  publish-local:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v8.2
      - uses: coursier/setup-action@v3.0
        with:
          jvm: 21
      - name: Publish local
        run: ./mill -i __.publishLocal

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Ensure no two jobs publish to Sonatype Central at the same time
    concurrency:
      group: sonatype-central-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v8.2
      - uses: coursier/setup-action@v3.0
        with:
          jvm: 21
      - name: Publish
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "jvm-index-${GITHUB_REF#refs/tags/v}" --shouldRelease false
          else
            for tag in $(git tag --points-at HEAD); do
              git tag -d "$tag"
            done
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/
          fi
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          ./mill -i mill.javalib.MavenPublishModule/publishAll \
            --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
            --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
        env:
          MILL_MAVEN_USERNAME: ${{ github.actor }}
          MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
